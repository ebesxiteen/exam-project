<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6z" fill="#555"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6z" fill="#E53935"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#FAFAFA" rx="8"/>
  <text x="370" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Luồng Validate &amp; Serialize với Pydantic Schema</text>

  <!-- INPUT FLOW -->
  <!-- Client Request -->
  <rect x="20" y="60" width="130" height="50" rx="6" fill="#BBDEFB" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Client Request</text>
  <text x="85" y="96" text-anchor="middle" font-size="9" fill="#555">JSON body</text>

  <line x1="150" y1="85" x2="185" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Schema In box -->
  <rect x="190" y="50" width="200" height="140" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">QuestionIn (Input Schema)</text>

  <rect x="200" y="78" width="180" height="100" rx="4" fill="#fff" stroke="#C8E6C9"/>
  <text x="210" y="95" font-size="10" fill="#333" font-weight="bold">content:</text>
  <text x="278" y="95" font-size="10" fill="#666">str (min_length=3)</text>
  <text x="210" y="112" font-size="10" fill="#333" font-weight="bold">choices:</text>
  <text x="268" y="112" font-size="10" fill="#666">list[ChoiceIn]</text>
  <text x="220" y="127" font-size="9" fill="#888">(min=2, max=6)</text>
  <text x="210" y="147" font-size="10" fill="#E65100" font-weight="bold">@model_validator:</text>
  <text x="220" y="162" font-size="9" fill="#E65100">exactly_one_correct()</text>

  <!-- Validation OK arrow -->
  <line x1="390" y1="100" x2="435" y2="100" stroke="#43A047" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="412" y="93" text-anchor="middle" font-size="9" fill="#43A047" font-weight="bold">OK</text>

  <!-- Validation Error arrow -->
  <line x1="290" y1="190" x2="290" y2="225" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Error box -->
  <rect x="210" y="230" width="160" height="45" rx="5" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="290" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">422 Validation Error</text>
  <text x="290" y="265" text-anchor="middle" font-size="9" fill="#C62828">{"detail": [...]}</text>
  <text x="288" y="222" text-anchor="middle" font-size="9" fill="#E53935" font-weight="bold">FAIL</text>

  <!-- Service -->
  <rect x="440" y="70" width="120" height="55" rx="6" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">Service Layer</text>
  <text x="500" y="108" text-anchor="middle" font-size="9" fill="#555">Business Logic</text>

  <!-- Arrow to response -->
  <line x1="560" y1="98" x2="595" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Schema Out box -->
  <rect x="600" y="55" width="120" height="85" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="660" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">QuestionOut</text>
  <text x="660" y="86" text-anchor="middle" font-size="9" fill="#888">(Output Schema)</text>

  <rect x="608" y="92" width="104" height="40" rx="3" fill="#fff" stroke="#BBDEFB"/>
  <text x="615" y="106" font-size="9" fill="#333">id: int</text>
  <text x="615" y="118" font-size="9" fill="#333">content: str</text>
  <text x="615" y="130" font-size="9" fill="#333">choices: [ChoiceOut]</text>

  <!-- OUTPUT FLOW SECTION -->
  <text x="370" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Schema tach biet Input / Output / Public</text>

  <!-- Three schema boxes side by side -->
  <!-- QuestionIn -->
  <rect x="30" y="325" width="200" height="82" rx="5" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="130" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">QuestionIn</text>
  <text x="40" y="360" font-size="9" fill="#555">content: str (validated)</text>
  <text x="40" y="374" font-size="9" fill="#555">choices: list[ChoiceIn]</text>
  <text x="40" y="388" font-size="9" fill="#E65100">+ exactly_one_correct</text>
  <text x="40" y="402" font-size="9" fill="#888">Dung cho: POST, PATCH</text>

  <!-- QuestionOut -->
  <rect x="260" y="325" width="200" height="82" rx="5" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="360" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">QuestionOut</text>
  <text x="270" y="360" font-size="9" fill="#555">id, content, choices</text>
  <text x="270" y="374" font-size="9" fill="#555">+ is_correct (visible)</text>
  <text x="270" y="388" font-size="9" fill="#1E88E5">from_attributes=True</text>
  <text x="270" y="402" font-size="9" fill="#888">Dung cho: Admin API</text>

  <!-- QuestionPublic -->
  <rect x="490" y="325" width="220" height="82" rx="5" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.2"/>
  <text x="600" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">QuestionPublic</text>
  <text x="500" y="360" font-size="9" fill="#555">id, content, points</text>
  <text x="500" y="374" font-size="9" fill="#E53935" font-weight="bold">KHONG co is_correct</text>
  <text x="500" y="388" font-size="9" fill="#FB8C00">from_entity()</text>
  <text x="500" y="402" font-size="9" fill="#888">Dung cho: Thi sinh lam bai</text>
</svg>